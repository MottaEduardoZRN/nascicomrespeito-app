name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  URL_DO_PROJETO: "https://nascicomrespeito.lovable.app"
  NOME_DO_APP: "Nasci com Respeito"

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Preparar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js e Java 21
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Criar estrutura do Capacitor
        run: |
          echo '{"name":"nascicomrespeito","version":"1.0.0","private":true}' > package.json
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head><body style="background:#fdf8f5;"></body></html>' > dist/index.html
          node -e 'fs.writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.nascicomrespeito.app",appName:process.env.NOME_DO_APP,webDir:"dist",server:{url:process.env.URL_DO_PROJETO,cleartext:true}}, null, 2))'

      - name: 4. Instalar Capacitor, criar pasta Android e aplicar icone
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets sharp
          npx cap add android
          if [ -f "icon.png" ]; then
            mkdir -p assets
            node -e '
              const sharp = require("sharp");
              (async () => {
                await sharp("icon.png").resize(1024, 1024, { fit: "contain", background: "#fdf8f5" }).png().toFile("assets/icon-only.png");
                await sharp("icon.png").resize(1024, 1024, { fit: "contain", background: "#fdf8f5" }).png().toFile("assets/icon-foreground.png");
                await sharp("icon.png").resize(2732, 2732, { fit: "contain", background: "#fdf8f5" }).png().toFile("assets/splash.png");
              })();
            '
            npx capacitor-assets generate --android --iconBackgroundColor '#fdf8f5' --splashBackgroundColor '#fdf8f5'
          fi
          npx cap sync android

      - name: 5. Compilar instalador APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Disponibilizar APK para transferencia
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
