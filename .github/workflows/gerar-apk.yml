name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  URL_DO_PROJETO: "https://nascicomrespeito.lovable.app"
  NOME_DO_APP: "Nasci com Respeito"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Preparar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js e Java 21
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Criar estrutura do Capacitor
        run: |
          npm init -y
          mkdir -p dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Nasci com Respeito</title>
            </head>
            <body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#fdf8f5;color:#333;">
              <p>Carregando aplicativo...</p>
            </body>
          </html>
          EOF

          cat << EOF > capacitor.config.json
          {
            "appId": "com.nascicomrespeito.app",
            "appName": "${NOME_DO_APP}",
            "webDir": "dist",
            "server": {
              "url": "${URL_DO_PROJETO}",
              "cleartext": true
            }
          }
          EOF

      - name: 5. Instalar Capacitor e criar pasta Android
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: 6. Compilar instalador APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
